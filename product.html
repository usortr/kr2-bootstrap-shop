<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка товара — ShopMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- ШАПКА (идентична index.html) -->
  <nav class="navbar navbar-expand-lg fixed-top shadow-sm site-navbar" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-bag-heart-fill me-2"></i>ShopMarket
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
              aria-controls="mainNavbar" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
          <li class="nav-item ms-lg-3">
            <a class="nav-link cart-link d-flex align-items-center" href="order.html" aria-label="Корзина">
              <i class="bi bi-cart3 fs-5"></i>
              <span id="cart-count" class="badge rounded-pill bg-danger ms-1" style="display: none;">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <!-- ХЛЕБНЫЕ КРОШКИ -->
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Главная</a></li>
        <li class="breadcrumb-item"><a href="catalog.html" class="text-decoration-none">Каталог</a></li>
        <li class="breadcrumb-item active" id="product-breadcrumb">Товар</li>
      </ol>
    </nav>

    <div class="row g-4" id="product-detail">
      <!-- Контент генерируется через JavaScript -->
    </div>
  </main>

  <!-- ПОДВАЛ -->
  <footer class="site-footer py-4">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 ShopMarket. Учебный проект.</p>
      <p class="mb-0 small" style="color: var(--text-muted);">«Фронтенд и бэкенд разработка» · КР №2</p>
    </div>
  </footer>

  <!-- КНОПКА НАВЕРХ -->
  <button id="backToTop" class="back-to-top" type="button" aria-label="Вернуться наверх">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- МОДАЛЬНОЕ ОКНО (идентично index.html) -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalLabel">Оформление заказа</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <form id="orderForm" class="needs-validation" novalidate>
            <input type="hidden" id="selectedProduct" name="product">
            <div class="mb-3">
              <label for="orderName" class="form-label">Ваше имя</label>
              <input type="text" class="form-control" id="orderName" required minlength="2">
              <div class="invalid-feedback">Введите имя (минимум 2 символа).</div>
            </div>
            <div class="mb-3">
              <label for="orderPhone" class="form-label">Телефон</label>
              <input type="tel" class="form-control" id="orderPhone" placeholder="+7 (999) 000-00-00" pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$" required>
              <div class="invalid-feedback">Формат: +7 (999) 000-00-00</div>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="orderAgreement" required>
              <label class="form-check-label" for="orderAgreement">Согласен на обработку персональных данных</label>
              <div class="invalid-feedback">Необходимо ваше согласие.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Подтвердить заказ</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-container">
    <div id="successToast" class="toast align-items-center text-white border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body"><i class="bi bi-check-circle-fill me-2"></i>Товар добавлен в корзину!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- СКРИПТЫ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
